# Runs the logic tests for pull requests, and by hand. Touch hardware cannot run in CI.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The main branch requires this check by name, so a rename must also change the ruleset.
  logic-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift test
