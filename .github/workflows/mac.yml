# Builds and tests the app for every pull request that touches it. A release, started by
# release.yml when a new MARKETING_VERSION lands on main, builds the app with the adapter inside
# it, signs it with Developer ID, notarizes it, builds and notarizes the DMG, publishes a GitHub
# release, and redeploys the landing page, which reads the newest release as it deploys. Run it by
# hand from the Actions tab for a dry run: the same build, signing, and notarization, with the DMG
# kept as a workflow artifact and nothing published.
#
# The release job uses the "release" environment, which holds these secrets:
#   MACOS_CERTIFICATE           the Developer ID Application certificate and its private key,
#                               exported as a .p12 and base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   NOTARY_API_KEY              an App Store Connect API key's .p8 file, as text
#   NOTARY_API_KEY_ID           that key's ID
#   NOTARY_API_ISSUER_ID        that key's issuer ID
#   SPARKLE_PRIVATE_KEY         the update signing key, from generate_keys -x
name: Mac app

on:
  pull_request:
    paths:
      - "trackpad-edges/**"
      - "trackpad-edges.xcodeproj/**"
      - "Tests/**"
      - "Config/**"
      - "scripts/**"
      - ".github/dmg/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:
  # From release.yml, with the tag to publish.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

env:
  DMG_NAME: TrackpadEdges.dmg
  # The project needs the macOS 27.2 SDK, and the SDK in the runner's default Xcode stops at 27.0.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift test
      - run: >
          xcodebuild build -project trackpad-edges.xcodeproj -scheme trackpad-edges
          -configuration Release -derivedDataPath "$PWD/build/DerivedData"
          -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO
      # This job holds no secrets, so an update to the DMG tool is tried here first.
      - run: npm ci --prefix .github/dmg
      - run: .github/dmg/node_modules/.bin/create-dmg --version

  release:
    if: inputs.tag != '' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ inputs.tag }}
      # Run by hand from the Actions tab, and not through release.yml: build only.
      DRY_RUN: ${{ inputs.tag == '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The lockfile fixes every package, and this runs first, so no new tool runs with the key open.
      - run: npm ci --prefix .github/dmg

      # A throwaway keychain holds the certificate and notary credentials until the job ends.
      - name: Set up signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" ||
            { echo "::error::MACOS_CERTIFICATE has no Developer ID Application identity"; exit 1; }

          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials release-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build and sign the app
        run: SIGN_KEYCHAIN="$KEYCHAIN" scripts/build-release.sh build/export

      - name: Check the version matches the tag
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/export/Trackpad Edges.app/Contents/Info.plist")"
          [ "$TAG" = "v$version" ] ||
            { echo "::error::tag $TAG does not match MARKETING_VERSION $version"; exit 1; }
          # Installed copies compare build numbers, so a build that is not higher is never offered.
          # This reads the newest release, and a failed lookup stops here. Version 1.0 has no feed,
          # and its build number is 1.
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/export/Trackpad Edges.app/Contents/Info.plist")"
          assets="$(gh release view --json assets --jq '.assets[].name')"
          live=1
          if grep -qx appcast.xml <<<"$assets"; then
            gh release download --pattern appcast.xml --dir "$RUNNER_TEMP"
            live="$(sed -n 's|.*<sparkle:version>\([0-9]*\)</sparkle:version>.*|\1|p' "$RUNNER_TEMP/appcast.xml")"
          fi
          [ -n "$live" ] && [ "$build" -gt "$live" ] ||
            { echo "::error::CURRENT_PROJECT_VERSION $build is not higher than the live build $live"; exit 1; }

      - name: Notarize the app
        run: |
          ditto -c -k --keepParent "build/export/Trackpad Edges.app" build/app.zip
          xcrun notarytool submit build/app.zip --keychain-profile release-notary --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "build/export/Trackpad Edges.app"
          spctl --assess --type execute -vv "build/export/Trackpad Edges.app"
          rm build/app.zip

      - name: Build and notarize the DMG
        run: |
          mkdir -p build/dmg
          .github/dmg/node_modules/.bin/create-dmg --overwrite --no-code-sign "build/export/Trackpad Edges.app" build/dmg
          mv build/dmg/*.dmg "build/$DMG_NAME"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*) \([0-9A-F]\{40\}\) "Developer ID Application.*/\1/p' | head -n 1)"
          codesign --force --timestamp --sign "$identity" --keychain "$KEYCHAIN" "build/$DMG_NAME"
          xcrun notarytool submit "build/$DMG_NAME" --keychain-profile release-notary --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "build/$DMG_NAME"

      # Only this step holds the key, and it reaches the tool on standard input.
      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          signed="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | build/export/sparkle-bin/sign_update --ed-key-file - "build/$DMG_NAME")"
          signature="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$signed")"
          [ -n "$signature" ] || { echo "::error::the update has no signature"; exit 1; }
          echo "UPDATE_SIGNATURE=$signature" >> "$GITHUB_ENV"

      # This uses the public key inside the built app, so a secret that does not match it stops here.
      - name: Check the signature and write the feed
        run: |
          info="build/export/Trackpad Edges.app/Contents/Info.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$info"; }
          version="$(read_key CFBundleShortVersionString)"
          swift scripts/verify-update.swift "build/$DMG_NAME" "$UPDATE_SIGNATURE" "$(read_key SUPublicEDKey)"
          python3 scripts/make-appcast.py "$version" "$(read_key CFBundleVersion)" \
            "$(read_key LSMinimumSystemVersion)" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$DMG_NAME" \
            "$(stat -f %z "build/$DMG_NAME")" "$UPDATE_SIGNATURE" "release-notes/v$version.md" build/appcast.xml
          xmllint --noout build/appcast.xml

      - name: Keep the DMG (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trackpad-edges-dmg
          path: |
            build/${{ env.DMG_NAME }}
            build/appcast.xml
          retention-days: 3

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This creates the tag too, so a release that fails earlier leaves no tag behind. It fails
          # if the release exists, so that a published DMG is never replaced.
          gh release create "$TAG" "build/$DMG_NAME" build/appcast.xml --target "$GITHUB_SHA" \
            --title "Trackpad Edges ${TAG#v}" --notes-file "release-notes/$TAG.md"

      # A release made with this workflow's token starts no workflow, so the deploy is started here.
      - name: Deploy the landing page
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" 2>/dev/null || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
