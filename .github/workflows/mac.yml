# Builds and tests the app for every pull request that touches it. A release, started by
# release.yml when a new MARKETING_VERSION lands on main, builds the app with the adapter inside
# it, signs it with Developer ID, notarizes it, builds and notarizes the DMG, publishes a GitHub
# release, and points the landing page at the download. Run it by hand from the Actions tab for a
# dry run: the same build, signing, and notarization, with the DMG kept as a workflow artifact and
# nothing published.
#
# The release job uses the "release" environment, which holds these secrets:
#   MACOS_CERTIFICATE           the Developer ID Application certificate and its private key,
#                               exported as a .p12 and base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   NOTARY_API_KEY              an App Store Connect API key's .p8 file, as text
#   NOTARY_API_KEY_ID           that key's ID
#   NOTARY_API_ISSUER_ID        that key's issuer ID
name: Mac app

on:
  pull_request:
    paths:
      - "trackpad-edges/**"
      - "trackpad-edges.xcodeproj/**"
      - "Tests/**"
      - "scripts/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:
  # From release.yml, with the tag that it pushed.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

env:
  DMG_NAME: TrackpadEdges.dmg

jobs:
  test:
    # The project needs Xcode 27.2.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: >
          xcodebuild build -project trackpad-edges.xcodeproj -scheme trackpad-edges
          -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

  release:
    if: inputs.tag != '' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ inputs.tag }}
      # Run by hand from the Actions tab, and not through release.yml: build only.
      DRY_RUN: ${{ inputs.tag == '' }}
    steps:
      - uses: actions/checkout@v7

      # This is pinned and installed first, so that it never runs a new version with the key open.
      - run: npm install --global create-dmg@8.1.0

      # A throwaway keychain holds the certificate and notary credentials until the job ends.
      - name: Set up signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" ||
            { echo "::error::MACOS_CERTIFICATE has no Developer ID Application identity"; exit 1; }

          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials release-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build and sign the app
        run: SIGN_KEYCHAIN="$KEYCHAIN" scripts/build-release.sh build/export

      - name: Check the version matches the tag
        if: env.DRY_RUN != 'true'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/export/Trackpad Edges.app/Contents/Info.plist")"
          [ "$TAG" = "v$version" ] ||
            { echo "::error::tag $TAG does not match MARKETING_VERSION $version"; exit 1; }

      - name: Notarize the app
        run: |
          ditto -c -k --keepParent "build/export/Trackpad Edges.app" build/app.zip
          xcrun notarytool submit build/app.zip --keychain-profile release-notary --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "build/export/Trackpad Edges.app"
          spctl --assess --type execute -vv "build/export/Trackpad Edges.app"
          rm build/app.zip

      - name: Build and notarize the DMG
        run: |
          mkdir -p build/dmg
          create-dmg --overwrite --no-code-sign "build/export/Trackpad Edges.app" build/dmg
          mv build/dmg/*.dmg "build/$DMG_NAME"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*) \([0-9A-F]\{40\}\) "Developer ID Application.*/\1/p' | head -n 1)"
          codesign --force --timestamp --sign "$identity" --keychain "$KEYCHAIN" "build/$DMG_NAME"
          xcrun notarytool submit "build/$DMG_NAME" --keychain-profile release-notary --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "build/$DMG_NAME"

      - name: Keep the DMG (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trackpad-edges-dmg
          path: build/${{ env.DMG_NAME }}
          retention-days: 3

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This creates the tag too, so a release that fails earlier leaves no tag behind.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/$DMG_NAME" --clobber
          else
            gh release create "$TAG" "build/$DMG_NAME" --target "$GITHUB_SHA" \
              --title "Trackpad Edges ${TAG#v}" --notes-file "release-notes/$TAG.md"
          fi

      # A push made with this workflow's token starts no workflow, so the deploy is started here.
      - name: Point the landing page at the download
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$DMG_NAME"
          sed -i '' -E "s|^  url: \".*\",|  url: \"$url\",|; s|^  version: \".*\",|  version: \"$version\",|" site/main.js
          grep -qF "$url" site/main.js || { echo "::error::site/main.js did not take the download link"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet site/main.js; then
            git add site/main.js
            git commit -m "chore(site): point the download at $version"
            # Another push can land first, so this tries a few times.
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              git rebase --abort 2>/dev/null || true
              [ "$attempt" -lt 5 ] || { echo "::error::could not push the download link"; exit 1; }
              sleep $((attempt * 5))
            done
          fi
          gh workflow run pages.yml --ref main

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" 2>/dev/null || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
