name: Feature request
description: Suggest something new for the app.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, so that other solutions can be considered too.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe how you imagine this working on the trackpad.
    validations:
      required: true
